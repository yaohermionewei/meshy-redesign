# Both subdomains serve the same dist/ (redesign2 reuses redesign1's scripts and shared /assets),
# and each one only exposes its own version.
server {
    listen 80;
    server_name meshy-redesign1.wystudio.zone;
    root /var/www/meshy-redesign;
    location = / { return 302 /redesign/1; }
    location ^~ /redesign/2 { return 404; }
    location / { try_files $uri $uri/ $uri/index.html =404; }
    location /assets/ { expires 30d; add_header Cache-Control "public"; }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}

server {
    listen 80;
    server_name meshy-redesign2.wystudio.zone;
    root /var/www/meshy-redesign;
    location = / { return 302 /redesign/2; }
    location ^~ /redesign/1 { return 404; }
    location / { try_files $uri $uri/ $uri/index.html =404; }
    location /assets/ { expires 30d; add_header Cache-Control "public"; }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
