name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: node scripts/build.mjs
      - name: Upload to server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          set -o pipefail
          tar -C dist -czf - . | ssh "ubuntu@$DEPLOY_HOST" 'sudo rm -rf /tmp/meshy-redesign-dist && sudo mkdir -p /tmp/meshy-redesign-dist && sudo tar -xzf - -C /tmp/meshy-redesign-dist && sudo mkdir -p /var/www/meshy-redesign && sudo rsync -a --delete /tmp/meshy-redesign-dist/ /var/www/meshy-redesign/ && sudo chown -R root:root /var/www/meshy-redesign && sudo rm -rf /tmp/meshy-redesign-dist'
